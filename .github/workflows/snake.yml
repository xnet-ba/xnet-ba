name: snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: xnet-ba
          outputs: |
            output/snake.svg?color_snake=#00FF41&color_dots=#0e2a0e,#123a12,#1a5a1a,#2a8a2a,#00FF41
            output/snake-dark.svg?palette=github-dark&color_snake=#00FF41
            output/snake-light.svg?palette=github-light&color_snake=#00a82a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
